[package]
name = "seatswap"
description = "Switch Claude Code between Claude accounts with one click (tray app + CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["claude", "claude-code", "tray", "accounts", "switcher"]
categories = ["command-line-utilities", "gui"]

# One library, two programs (docs/windows.md §6.1): `seatswap-tray` is the same
# program built without a console window on Windows, for autostart and the
# Start menu. Linux builds it too but does not install or release it.
[lib]
name = "seatswap"
path = "src/lib.rs"

[[bin]]
name = "seatswap"
path = "src/main.rs"

[[bin]]
name = "seatswap-tray"
path = "src/bin/seatswap-tray.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tiny-skia", "dep:ab_glyph", "dep:notify-rust", "dep:tray-icon", "dep:gtk", "dep:gdkx11", "dep:winreg"]

[dependencies]
seatswap-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tiny-skia = { version = "0.11", optional = true }
ab_glyph = { version = "0.2", optional = true }
# 4.19: `wait_for_response` with the same typed answer on Linux and Windows.
notify-rust = { version = "4.19", optional = true }

# Linux: Tauri's tray backend (libappindicator) reports no clicks (every click
# opens the menu) and drops the tooltip. Enabling tray-icon's StatusNotifierItem
# backend (ksni) gives left click → panel, right click → menu, and the tooltip;
# tray-icon uses ksni when both backends are on. Same tray-icon Tauri already
# uses, so there is still one tray code path.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"], optional = true }
# The panel asks for focus with the X server's time (panel.rs `take_focus`);
# the same versions Tauri already uses.
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }

# Windows (docs/windows.md). Both were already in Cargo.lock: uds_windows
# through notify-rust, winreg through Tauri's build tooling.
[target.'cfg(windows)'.dependencies]
# Unix sockets for the single-instance socket (gui/ipc.rs), until
# std::os::windows::net is stable (rust-lang/rust#150487); then ipc.rs imports
# from std and this crate goes.
uds_windows = "1.2"
# The autostart entry (Run key) and the notification name.
winreg = { version = "0.56", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"
