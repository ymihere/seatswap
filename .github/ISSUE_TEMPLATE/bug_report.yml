name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste tokens.** Output of seatswap never contains one, but `.credentials.json` does.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: seatswap version (`seatswap --version`)
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (`claude --version`)
  - type: input
    id: desktop
    attributes:
      label: OS and desktop (e.g. Linux Mint 22.2 Cinnamon, X11)
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error messages or terminal output
      render: text
